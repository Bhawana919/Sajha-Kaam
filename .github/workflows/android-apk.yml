# Builds the Android app (APK) on GitHub's servers and attaches it to the "Android app (latest)"
# release, so anyone can download and install it on a phone. Runs when the app changes on main,
# or by hand: Actions -> Android APK -> Run workflow.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write  # to publish the release with the APK

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      # The installed app talks to the live server (the website uses the same data).
      EXPO_PUBLIC_API_URL: https://sajha-kaam.onrender.com
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install app packages
        run: npm ci --no-audit --no-fund

      - name: Check the app (types, lint, translations)
        run: npm run check

      - name: Create the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Name the APK
        run: |
          mkdir -p ../out
          cp android/app/build/outputs/apk/release/app-release.apk ../out/sajha-kaam.apk
          ls -lh ../out

      - uses: actions/upload-artifact@v4
        with:
          name: sajha-kaam-apk
          path: out/sajha-kaam.apk

      - name: Publish to the "Android app (latest)" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android app (latest)
          prerelease: true
          make_latest: false
          files: out/sajha-kaam.apk
          body: |
            Sajha Kaam for Android, built from `${{ github.sha }}`.

            **Install:** open this page on an Android phone, tap **sajha-kaam.apk**, then **Install**.
            If Android asks, allow your browser to "install unknown apps" (a test app, not from the Play Store).

            The app uses the live server https://sajha-kaam.onrender.com. Demo password for everyone: `kaam-demo`.
