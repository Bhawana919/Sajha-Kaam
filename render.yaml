# Render blueprint: one free web service built from the Dockerfile (app + API on one address).
# Render dashboard -> New -> Blueprint -> pick this GitHub repo.
services:
  - type: web
    name: sajha-kaam
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "1"
