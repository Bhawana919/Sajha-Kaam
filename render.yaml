# Render blueprint: one web service built from the Dockerfile (app + API on one address).
# Render dashboard -> New -> Blueprint -> pick this GitHub repo.
# Starter plan (paid from hackathon credit): never sleeps, so the demo link opens straight away.
# The database stays temporary on purpose: each deploy or restart starts from fresh demo data.
services:
  - type: web
    name: sajha-kaam
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "1"
      # Video uploads: paste the "API environment variable" from the Cloudinary dashboard
      # (cloudinary://key:secret@cloud). Without it, members paste a video link instead.
      - key: CLOUDINARY_URL
        sync: false
