# Render blueprint: one web service built from the Dockerfile (app + API on one address).
# Render dashboard -> New -> Blueprint -> pick this GitHub repo.
# Free plan (no card): sleeps after 15 minutes without visitors; the next visit takes about a minute.
# Data: set DATABASE_URL to a free Neon Postgres link so accounts and jobs are kept. Without it the
# database is temporary and each restart starts again from the demo.
services:
  - type: web
    name: sajha-kaam
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "1"
      # Permanent data: the connection string from Neon (neon.tech, free, no card).
      - key: DATABASE_URL
        sync: false
      # Video and photo uploads: the "API environment variable" from the Cloudinary dashboard
      # (cloudinary://key:secret@cloud). Without it, members paste a video link instead.
      - key: CLOUDINARY_URL
        sync: false
